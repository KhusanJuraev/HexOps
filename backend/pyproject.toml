[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexops-backend"
version = "0.1.0"
description = "HexOps local-first security research workspace — API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.20",  # evidence uploads (multipart/form-data)
  # Stage 7 PDF (D-83, D-84). Chromium itself: `playwright install --only-shell chromium`.
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
  "playwright>=1.45",
  "pymupdf>=1.24",
  "cryptography>=42",  # AES-256-GCM for .hexops archives (D-90)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
# Installer tests drive fixed local programs (bash, psql, sudo) on throwaway data.
"tests/installer/*" = ["S101", "S105", "S106", "S603", "S607", "S608"]
"alembic/versions/*" = ["E501"]  # generated DDL and SQL literals
